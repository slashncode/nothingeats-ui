name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  pnpm:
    uses: slashncode/nothingeats-ci/.github/workflows/pnpm.yml@main
    permissions:
      contents: read
    with:
      browser-tests: true # Storybook stories run as Vitest browser tests

  codeql:
    uses: slashncode/nothingeats-ci/.github/workflows/codeql.yml@main
    permissions:
      contents: read
      security-events: write
    with:
      language: javascript-typescript

  pr:
    if: github.event_name == 'pull_request'
    uses: slashncode/nothingeats-ci/.github/workflows/pr-hygiene.yml@main
    permissions:
      contents: read
      pull-requests: write
