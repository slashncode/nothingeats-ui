# pnpm settings (no workspace packages). pnpm writes some of these itself.

# Install scripts stay off: both packages ship prebuilt binaries through optional dependencies.
allowBuilds:
  '@parcel/watcher': false
  esbuild: false

minimumReleaseAgeExcludePrune: true
shellEmulator: true
trustPolicy: no-downgrade

# semver 6.3.1 (July 2023, required by @babel/core) predates npm provenance, while newer
# semver 7 releases have it; the no-downgrade trust policy reads that as a takeover.
trustPolicyExclude:
  - semver@6.3.1
